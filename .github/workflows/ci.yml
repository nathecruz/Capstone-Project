name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Optional repository secret: a Neon branch (direct, non-pooler host) for the API integration test.
      # The test runs inside a random private schema and drops it afterwards.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: API integration test (PostgreSQL)
        if: env.TEST_DATABASE_URL != ''
        run: node --test test/api.test.js
      - name: Environment checker tests
        working-directory: .
        run: node --test scripts/check-env.test.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm test

  admin-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-panel/server/package-lock.json
            admin-panel/client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm --prefix server test
      - run: npm --prefix client run build

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r ml-service/requirements.txt
      - run: python -m unittest discover -s ml-service/tests
        env:
          PYTHONPATH: ml-service
