services:
  - type: web
    name: habitai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: NODE_ENV=production node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: DATABASE_URL
        sync: false
      - key: AUTH_URL
        value: https://ep-plain-flower-b3ie6u23.neonauth.c-4.ap-southeast-1.aws.neon.tech/habit_tracker_db/auth
      - key: JWKS_URL
        value: https://ep-plain-flower-b3ie6u23.neonauth.c-4.ap-southeast-1.aws.neon.tech/habit_tracker_db/auth/.well-known/jwks.json
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: habitai-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          type: web
          name: habitai-ml
          envVarKey: ML_SERVICE_API_KEY
      - key: ALLOWED_ORIGINS
        value: https://project-b3gc.vercel.app,https://capstone-project-b3gc.vercel.app
      - key: EXTERNAL_REQUEST_TIMEOUT_MS
        value: 15000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: adrielleestacio00@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: adrielleestacio00@gmail.com
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        value: mailto:adrielleestacio00@gmail.com

  - type: cron
    name: habitai-web-push
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm install
    schedule: '* * * * *'
    startCommand: npm run push:dispatch
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: DATABASE_URL
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        fromService:
          type: web
          name: habitai-backend
          envVarKey: WEB_PUSH_VAPID_PUBLIC_KEY
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        fromService:
          type: web
          name: habitai-backend
          envVarKey: WEB_PUSH_VAPID_PRIVATE_KEY
      - key: WEB_PUSH_VAPID_SUBJECT
        fromService:
          type: web
          name: habitai-backend
          envVarKey: WEB_PUSH_VAPID_SUBJECT
      - key: WEB_PUSH_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: habitai-ml
    runtime: docker
    plan: free
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: RUSTUP_HOME
        value: /tmp/rustup
      - key: ML_SERVICE_API_KEY
        generateValue: true
      - key: ML_MODEL_RELEASE_APPROVED
        value: false
      - key: ML_SERVICE_HOST
        value: 0.0.0.0
      - key: ML_SERVICE_PORT
        value: 8000
      - key: NODE_ENV
        value: production

  - type: web
    name: habitai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run export:web
    staticPublishPath: dist
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_AI_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_AUTH_URL
        value: https://ep-plain-flower-b3ie6u23.neonauth.c-4.ap-southeast-1.aws.neon.tech/habit_tracker_db/auth
