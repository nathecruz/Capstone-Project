services:
  - type: web
    name: habitai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: NODE_ENV=production node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: DATABASE_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: JWKS_URL
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: habitai-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          type: web
          name: habitai-ml
          envVarKey: ML_SERVICE_API_KEY
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EXTERNAL_REQUEST_TIMEOUT_MS
        value: 15000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: habitai-ml
    runtime: python
    pythonVersion: "3.11"
    plan: free
    rootDir: ml-service
    buildCommand: >
      mkdir -p /tmp/cargo /tmp/rustup &&
      export CARGO_HOME=/tmp/cargo &&
      export RUSTUP_HOME=/tmp/rustup &&
      export PIP_NO_CACHE_DIR=1 &&
      export PIP_DISABLE_PIP_VERSION_CHECK=1 &&
      python -m pip uninstall -y pydantic pydantic-core fastapi starlette || true &&
      python -m pip install --upgrade pip setuptools wheel &&
      python -m pip install --no-cache-dir --prefer-binary "fastapi==0.95.2" "uvicorn==0.32.1" "pydantic==1.10.22" "scikit-learn==1.6.1" "joblib==1.4.2" "xgboost==2.1.3" "statsmodels==0.14.5" "pandas<3" "pytest==9.1.1"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/ml-service
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: RUSTUP_HOME
        value: /tmp/rustup
      - key: ML_SERVICE_API_KEY
        generateValue: true
      - key: ML_MODEL_RELEASE_APPROVED
        value: false
      - key: ML_SERVICE_HOST
        value: 0.0.0.0
      - key: ML_SERVICE_PORT
        value: 8000
      - key: NODE_ENV
        value: production

  - type: web
    name: habitai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run export:web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_AI_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_AUTH_URL
        sync: false
