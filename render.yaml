services:
  - type: web
    name: habitai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: NODE_ENV=production node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: DATABASE_URL
        sync: false
      - key: AUTH_URL
        value: https://ep-plain-flower-b3ie6u23.neonauth.c-4.ap-southeast-1.aws.neon.tech/habit_tracker_db/auth
      - key: JWKS_URL
        value: https://ep-plain-flower-b3ie6u23.neonauth.c-4.ap-southeast-1.aws.neon.tech/habit_tracker_db/auth/.well-known/jwks.json
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: habitai-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          type: web
          name: habitai-ml
          envVarKey: ML_SERVICE_API_KEY
      - key: ALLOWED_ORIGINS
        # Every place the web app is served from: the Vercel domains and the Render static site.
        value: https://project-b3gc.vercel.app,https://capstone-project-b3gc.vercel.app,https://habitai-frontend.onrender.com
      - key: EXTERNAL_REQUEST_TIMEOUT_MS
        value: 15000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_GOALS
        sync: false
      - key: GEMINI_API_KEY_COACH
        sync: false
      - key: GEMINI_API_KEY_ASSISTANT
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Verification, password reset and support emails. Free Render web services block
      # outbound SMTP (ports 25/465/587), so production sends through Brevo's HTTPS API:
      # BREVO_API_KEY from brevo.com (SMTP & API -> API keys) and EMAIL_FROM, a sender
      # verified in Brevo. SMTP_* is only used when BREVO_API_KEY is empty (local dev,
      # paid plans). Set these in the Render dashboard; values are kept on Blueprint sync.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false

  # Web Push reminder cron (disabled). Render cron jobs are paid (from about $1/month) and
  # need a payment method on the workspace; while this block was active every Blueprint sync
  # failed with "need_payment_info", so no service in this file was updated or created.
  # Reminders are sent for free by .github/workflows/web-push-reminders.yml instead. To use
  # this cron instead, add a payment method in Render and uncomment the block below.
  # - type: cron
  #   name: habitai-web-push
  #   runtime: node
  #   plan: 0.5c-512mb
  #   rootDir: backend
  #   buildCommand: npm install
  #   schedule: '* * * * *'
  #   startCommand: npm run push:dispatch
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromService:
  #         type: web
  #         name: habitai-backend
  #         envVarKey: DATABASE_URL
  #     - key: WEB_PUSH_VAPID_PUBLIC_KEY
  #       fromService:
  #         type: web
  #         name: habitai-backend
  #         envVarKey: WEB_PUSH_VAPID_PUBLIC_KEY
  #     - key: WEB_PUSH_VAPID_PRIVATE_KEY
  #       fromService:
  #         type: web
  #         name: habitai-backend
  #         envVarKey: WEB_PUSH_VAPID_PRIVATE_KEY
  #     - key: WEB_PUSH_VAPID_SUBJECT
  #       fromService:
  #         type: web
  #         name: habitai-backend
  #         envVarKey: WEB_PUSH_VAPID_SUBJECT
  #     - key: WEB_PUSH_API_URL
  #       fromService:
  #         type: web
  #         name: habitai-backend
  #         envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: habitai-ml
    runtime: docker
    plan: free
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: RUSTUP_HOME
        value: /tmp/rustup
      - key: ML_SERVICE_API_KEY
        generateValue: true
      - key: ML_MODEL_RELEASE_APPROVED
        value: false
      - key: ML_SERVICE_HOST
        value: 0.0.0.0
      - key: ML_SERVICE_PORT
        value: 8000
      - key: NODE_ENV
        value: production

  # Admin Panel for PSAU faculty and administrators (admin-panel/). It serves its own
  # React client and API and shares the app's Neon database. Migrations run at start-up.
  - type: web
    name: habitai-admin
    runtime: docker
    plan: free
    rootDir: admin-panel
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: APP_TIME_ZONE
        value: Asia/Manila
      - key: ADMIN_SESSION_HOURS
        value: 12
      - key: DATABASE_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: DATABASE_URL

  - type: web
    name: habitai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run export:web
    staticPublishPath: dist
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_AI_API_URL
        fromService:
          type: web
          name: habitai-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXPO_PUBLIC_AUTH_URL
        value: https://ep-plain-flower-b3ie6u23.neonauth.c-4.ap-southeast-1.aws.neon.tech/habit_tracker_db/auth
