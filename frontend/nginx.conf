server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}