services:
  ml-service:
    build:
      context: ./ml-service
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-only-local-key}
      ML_MODEL_RELEASE_APPROVED: ${ML_MODEL_RELEASE_APPROVED:-false}
      NODE_ENV: ${COMPOSE_NODE_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: ${COMPOSE_NODE_ENV:-development}
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      AUTH_URL: ${AUTH_URL:-https://example.com/auth}
      JWKS_URL: ${JWKS_URL:-https://example.com/.well-known/jwks.json}
      EXTERNAL_REQUEST_TIMEOUT_MS: ${EXTERNAL_REQUEST_TIMEOUT_MS:-15000}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-only-local-key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8787}
        EXPO_PUBLIC_AI_API_URL: ${EXPO_PUBLIC_AI_API_URL:-http://localhost:8787}
        EXPO_PUBLIC_AUTH_URL: ${EXPO_PUBLIC_AUTH_URL:-http://localhost:8787}
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

